# Render Blueprint — deploy the Django backend as a web service
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rezinserp-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # set manually to your Vercel URL
      - key: DATABASE_URL
        fromDatabase:
          name: rezinserp-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"

databases:
  - name: rezinserp-db
    plan: free
    region: oregon
    databaseName: rezinserp
    user: rezinserp
